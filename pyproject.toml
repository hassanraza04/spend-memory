[project]
name = "spend-memory-api"
version = "0.1.0"
description = "Spend Memory API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2.0",
  "dbt-core>=1.9,<2.0",
  "dbt-duckdb>=1.9,<2.0",
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pymupdf>=1.28.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "reportlab>=4.2,<5.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api", "."]
filterwarnings = [
  "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.ruff]
target-version = "py312"
