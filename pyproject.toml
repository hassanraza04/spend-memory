[project]
name = "spend-memory-api"
version = "0.1.0"
description = "Spend Memory API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
filterwarnings = [
  "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.ruff]
target-version = "py312"
