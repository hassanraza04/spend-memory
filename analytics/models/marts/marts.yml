version: 2

models:
  - name: mart_transactions
    columns:
      - name: raw_transaction_id
        tests:
          - not_null
          - unique
      - name: import_run_id
        tests: [not_null]
      - name: document_id
        tests: [not_null]
      - name: original_filename
        tests: [not_null]
      - name: parser_id
        tests: [not_null]
      - name: parser_version
        tests: [not_null]
      - name: source_ordinal
        tests: [not_null]
      - name: source_row
        tests: [not_null]
      - name: source_text
        tests: [not_null]
      - name: extraction_method
        tests: [not_null]
      - name: extraction_confidence
        tests: [not_null]
      - name: account_identity
        tests: [not_null]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AED, PKR]
      - name: direction
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [debit, credit]
      - name: merchant_id
        description: Nullable until a merchant annotation is confirmed.
      - name: category_id
        description: Nullable until a category is confirmed.
      - name: enrichment_version
        description: Nullable enrichment fields use unavailable when no annotation exists.

  - name: mart_merchants
    description: Local merchant dimension.
    columns:
      - name: merchant_id
      - name: merchant_name
      - name: enrichment_version

  - name: mart_categories
    description: Local category dimension.
    columns:
      - name: category_id
      - name: category_label
      - name: enrichment_version

  - name: mart_recurring_groups
    description: Review-candidate dimension. Rows are not confirmed transaction facts.
    columns:
      - name: recurring_group_id
        tests: [not_null, unique]
      - name: recurring_group_label
        tests: [not_null]
      - name: enrichment_version
        tests: [not_null]

  - name: mart_monthly_summary
    tests:
      - unique:
          arguments:
            column_name: "account_identity || '|' || currency || '|' || cast(period_start as varchar) || '|' || direction"
    columns:
      - name: account_identity
        tests: [not_null]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AED, PKR]
      - name: period_start
        tests: [not_null]
      - name: direction
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [debit, credit]

  - name: mart_category_summary
    columns:
      - name: account_identity
        tests: [not_null]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AED, PKR]
      - name: category_label
        tests: [not_null]

  - name: mart_period_comparisons
    tests:
      - unique:
          arguments:
            column_name: "account_identity || '|' || currency || '|' || cast(period_start as varchar) || '|' || direction"
    columns:
      - name: account_identity
        tests: [not_null]
      - name: currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AED, PKR]
      - name: period_start
        tests: [not_null]
      - name: previous_period_start
        tests: [not_null]
      - name: direction
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [debit, credit]
