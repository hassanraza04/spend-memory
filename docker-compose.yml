services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DUCKDB_PATH: /data/spend-memory.duckdb
      SPEND_MEMORY_DATA_DIRECTORY: /data/documents
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - duckdb_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => { if (!response.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  duckdb_data:
    driver: local
