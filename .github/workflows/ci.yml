name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: make test
      - run: pnpm --dir apps/web build
      - name: Run local browser workflows
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          make e2e
      - name: Start Compose services
        run: docker compose up --build -d
      - name: Verify HTTP endpoints
        run: |
          for url in http://127.0.0.1:8000/health http://127.0.0.1:3000/; do
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "$url"; then
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Timed out waiting for $url"
                exit 1
              fi

              sleep 2
            done
          done
      - name: Print Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Shut down Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans
